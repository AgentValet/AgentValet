title = "AgentValet public mirror gitleaks config"

[extend]
useDefault = true

# False positives: */pem.ts validates that a USER-supplied key has the correct
# PEM header/footer. The "-----BEGIN ... PRIVATE KEY-----" strings are literals in
# validation logic + an error message — there is no key body. Verified by reading
# the file. Scoped to *pem.ts so a real key pasted anywhere else is still caught.
[[allowlists]]
description = "PEM header literals in key-validation code (no key body)"
condition = "AND"
paths = ['''pem\.ts$''']
regexes = ['''-----BEGIN (RSA |PKCS8 )?PRIVATE KEY-----''']

# Dummy PEM fixtures in unit tests — the key body is a literal placeholder
# (e.g. "test"), not key material. Verified by reading the file. Scoped to
# *.test.ts so a real key pasted into product code is still caught.
[[allowlists]]
description = "Placeholder PEM key fixtures in unit tests (no real key body)"
condition = "AND"
paths = ['''\.test\.ts$''']
regexes = ['''-----BEGIN (RSA |PKCS8 )?PRIVATE KEY-----''']

# Fake credential fixtures in @agentvalet/mcp-broker tests and the
# insecure-then-fixed demo. Placeholder tokens (e.g. "ghp_rw", a deliberately
# naive example personal access token, "mint-…", "tok-…"), never real key
# material. Verified by reading the files. Scoped by path AND token shape so a
# real secret pasted anywhere else is still caught.
[[allowlists]]
description = "Placeholder credential fixtures in mcp-broker tests and demo"
condition = "AND"
paths = ['''packages/mcp-broker/(tests|examples)/.*''']
regexes = ['''(ghp_[A-Za-z0-9]+|mint-[A-Za-z0-9-]+|tok-[A-Za-z0-9-]+)''']
