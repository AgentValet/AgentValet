# Local policy for @agentvalet/mcp-broker.
#
# Deliberately small: one file, one rule per tool, deny by default. There are no
# environments, no inheritance, no templating, and no record of who changed a
# rule. The moment you need any of those, that is the hosted control plane, and
# the YAML never grows to cover it. Point the broker at this file with
# policy: "file:./policy.yaml".
version: 1

defaults:
  effect: deny

rules:
  - tool: list_issues
    effect: allow
    credential: github_readonly

  - tool: create_issue
    effect: allow
    credential: github_issues_rw

  - tool: delete_repo
    effect: require_approval
    credential: github_admin

  # A tool that sends mail: every address in to, cc and bcc must be at one of
  # the listed domains or be one of the listed addresses, or the call is denied
  # before it runs. Subdomains must be listed one by one.
  - tool: send_email
    effect: allow
    credential: mail_send
    recipient_args: to, cc, bcc
    allowed_domains: acme.com, partner.io
    allowed_addresses: ceo@partner-bank.com
