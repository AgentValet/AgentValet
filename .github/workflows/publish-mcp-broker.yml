name: Publish mcp-broker
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack and validate only, do not publish"
        type: boolean
        default: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish   # required-reviewer gate; NPM_TOKEN is an environment secret
    permissions:
      contents: read
      id-token: write   # required for npm provenance attestation
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agentvalet/mcp-broker build
      - name: Publish with provenance
        working-directory: packages/mcp-broker
        run: npm publish --access public --provenance ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
